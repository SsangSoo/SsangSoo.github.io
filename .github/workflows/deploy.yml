# main에 push하면 index.html로 resume.pdf를 새로 만들고, 사이트와 함께 GitHub Pages에 배포합니다.
# 사전 설정: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 지정
name: Build PDF & Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Korean fonts (fallback)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk poppler-utils > /dev/null

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html portfolio.html profile.jpg _site/

      - name: Build PDFs with headless Chrome
        run: |
          google-chrome --version
          for pair in "index.html:resume.pdf" "portfolio.html:portfolio.pdf"; do
            SRC="${pair%%:*}"; OUT="${pair##*:}"
            google-chrome --headless=new --no-sandbox --disable-gpu \
              --no-pdf-header-footer \
              --virtual-time-budget=10000 \
              --print-to-pdf="$GITHUB_WORKSPACE/_site/$OUT" \
              "file://$GITHUB_WORKSPACE/$SRC"
          done

      - name: Verify PDFs
        run: |
          for f in resume.pdf portfolio.pdf; do
            test -s "_site/$f" || { echo "::error::$f가 생성되지 않았습니다"; exit 1; }
            pdfinfo "_site/$f"
            pdffonts "_site/$f"
            PAGES=$(pdfinfo "_site/$f" | awk '/^Pages:/ {print $2}')
            echo "### $f: ${PAGES}페이지 생성" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Keep PDFs as downloadable build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: |
            _site/resume.pdf
            _site/portfolio.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
